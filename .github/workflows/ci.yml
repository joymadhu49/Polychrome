name: CI

# Builds the app on every push and pull request so regressions surface
# immediately instead of at release-tag time. Uses the same scripts/build.sh
# the release pipeline runs; without a Developer ID cert it falls back to
# ad-hoc signing, which is fine for a compile + bundle check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build + bundle (ad-hoc signed)
        run: bash scripts/build.sh

      - name: Verify bundle layout
        run: |
          set -euo pipefail
          test -x build/Polychrome.app/Contents/MacOS/Polychrome
          test -f build/Polychrome.app/Contents/Info.plist
          APP=build/Polychrome.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          # Universal: an arm64-only binary won't launch on Intel Macs, which
          # macOS 13 (our minimum) still supports.
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/Polychrome")
          echo "archs: $ARCHS"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]
          # Sparkle embedded, resolvable, and every nested piece signed.
          test -d "$APP/Contents/Frameworks/Sparkle.framework"
          # (captured, not piped to grep -q: an early grep exit SIGPIPEs otool under pipefail)
          LOADS=$(otool -l "$APP/Contents/MacOS/Polychrome")
          [[ "$LOADS" == *'@executable_path/../Frameworks'* ]]
          /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
